<!doctype html><html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="description" content="Caderninho: wiki pessoal de anotações por categoria.">
<title>Caderninho 🌸</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B8%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff6fa;--ink:#4a3a5e;--acc:#ff78b4;--soft:#f1e9ff}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font:16px/1.6 Nunito,system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 0,#ffe3f0,transparent 40%),radial-gradient(circle at 100% 100%,#e4dcff,transparent 40%),var(--bg);min-height:100vh}
h1,h2,b,.btn{font-family:Quicksand,sans-serif}
#app{display:flex;min-height:100vh}
aside{width:260px;padding:20px;background:#ffffffaa;backdrop-filter:blur(8px);border-right:2px dashed #ffd0e5;flex-shrink:0}
aside h2{margin:0 0 14px;font-size:24px}
main{flex:1;padding:24px;max-width:1000px}
.top{display:flex;gap:10px;margin-bottom:22px}
input,select{font:inherit;color:inherit;padding:11px 16px;border:2px solid #ffd0e5;border-radius:99px;background:#fff;outline:0;transition:.2s}
input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 4px #ff78b466}
#busca{flex:1}
.btn{border:0;border-radius:99px;padding:11px 20px;background:var(--acc);color:#fff;font-weight:700;cursor:pointer;transition:transform .15s cubic-bezier(.3,1.8,.5,1)}
.btn:hover{transform:scale(1.07) rotate(-1deg)}.btn:active{transform:scale(.94)}
.btn.ghost{background:var(--soft);color:var(--ink);width:100%;margin-top:10px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.cat{display:flex;align-items:center;gap:6px;padding:10px 14px;margin:6px 0;border-radius:18px;cursor:pointer;background:var(--c,#f1e9ff);transition:transform .2s cubic-bezier(.3,1.8,.5,1)}
.cat:hover{transform:translateX(6px)}.cat.on{outline:3px solid var(--acc)}
.cat span{flex:1;pointer-events:none}.cat small{opacity:.6;pointer-events:none}.cat i{opacity:0;font-style:normal;transition:.2s}.cat:hover i,.cat:focus-within i{opacity:1}
/* sem hover (toque): o botão de editar precisa ficar sempre visível */
@media(hover:none){.cat i{opacity:1}.cat:hover{transform:none}}
@media(max-width:720px){#cats{max-height:46vh;overflow:auto}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{background:#fff;border-radius:24px;padding:18px;box-shadow:0 6px 0 #ffd0e5}
.tp{cursor:pointer;animation:pop .45s cubic-bezier(.3,1.6,.5,1) both;border-bottom:6px solid var(--c)}
.tp:hover{transform:translateY(-5px) rotate(-1deg);box-shadow:0 12px 0 #ffd0e5}.tp{transition:.2s}
.tp small{display:block;opacity:.6}
@keyframes pop{from{opacity:0;transform:scale(.8) translateY(14px)}}
.empty{text-align:center;padding:60px 0}.mascot{font-size:64px;display:inline-block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px) rotate(6deg)}}
.hint{opacity:.6;font-size:14px;margin:14px 0 0}
.doc .body img{max-width:100%;border-radius:16px;margin:8px 0;box-shadow:0 4px 0 #ffd0e5}
.doc .row{display:flex;gap:8px;margin-top:16px}
.doc .meta{opacity:.55;font-size:14px}
dialog{border:0;border-radius:28px;padding:24px;width:min(680px,94vw);box-shadow:0 20px 0 #ffd0e588,0 0 0 9999px #4a3a5e55;color:var(--ink)}
dialog[open]{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
dialog input,dialog select{width:100%;margin-bottom:10px}
.tb{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}.tb button{border:0;background:var(--soft);border-radius:12px;padding:6px 12px;cursor:pointer;font:700 14px Quicksand}
#ed{min-height:240px;max-height:50vh;overflow:auto;border:2px solid #ffd0e5;border-radius:18px;padding:14px;outline:0}
#ed:focus{border-color:var(--acc);box-shadow:0 0 0 4px #ff78b466}
#ed img{max-width:100%;border-radius:12px}
.login{max-width:320px;margin:15vh auto;text-align:center}.login input{width:100%;margin:10px 0}
.conf{position:fixed;top:-30px;font-size:26px;pointer-events:none;animation:fall 1.4s ease-in forwards;z-index:99}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);max-width:90vw;background:#4a3a5e;color:#fff;padding:12px 20px;border-radius:99px;box-shadow:0 8px 24px #4a3a5e44;z-index:100;font-weight:600}
@media(max-width:720px){#app{flex-direction:column}aside{width:auto}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="login" hidden><div class="card login"><div class="mascot">🐱</div><h1>Caderninho</h1>
<input id="senha" type="password" placeholder="Senha" aria-label="Senha de acesso" autocomplete="current-password">
<button class="btn" id="entrar">Entrar</button></div></div>
<div id="app" hidden>
<aside><h2>🌸 Caderninho</h2><nav id="cats" aria-label="Categorias"></nav><button class="btn ghost" id="newcat">+ Nova categoria</button></aside>
<main><div class="top"><input id="busca" placeholder="🔍 Buscar nos tópicos..." aria-label="Buscar nos tópicos"><button class="btn" id="newtopic">+ Novo tópico</button></div><div id="view" aria-live="polite"></div></main></div>
<div id="toast" hidden role="status" aria-live="polite"></div>
<dialog id="dcat" aria-label="Categoria">
<h2>Categoria</h2>
<input id="cn" placeholder="Nome (ex: Impostos)" aria-label="Nome da categoria">
<input id="ce" placeholder="Emoji (ex: 💸)" maxlength="4" aria-label="Emoji da categoria">
<input id="cc" type="color" value="#ffd6e7" aria-label="Cor da categoria">
<div class="row"><button class="btn" id="csave">Salvar categoria</button> <button class="btn ghost" id="cdel" style="width:auto">Excluir</button> <button class="btn ghost" style="width:auto" id="ccancel">Cancelar</button></div>
</dialog>
<dialog id="dtopic" aria-label="Tópico">
<input id="tt" placeholder="Título do tópico" aria-label="Título do tópico"><select id="tc" aria-label="Categoria do tópico"></select>
<div class="tb"><button data-c="bold" aria-label="Negrito">B</button><button data-c="italic" aria-label="Itálico">I</button><button data-c="h2">Título</button><button data-c="ul">• Lista</button><button data-c="ol">1. Passos</button><button id="pic">📷 Foto</button><input id="file" type="file" accept="image/*" hidden></div>
<div id="ed" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Corpo do tópico" data-ph="Escreva aqui... cole prints com Ctrl+V"></div>
<div style="margin-top:14px"><button class="btn" id="tsave">Salvar tópico</button> <button class="btn ghost" id="tcancel" style="width:auto">Cancelar</button></div>
</dialog>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MSG={senha:'Senha incorreta 🙈',muitas_tentativas:'Muitas tentativas. Tente de novo em alguns minutos.',csrf:'Sessão expirada. Recarregue a página.',auth:'Entre novamente.',grande:'Arquivo grande demais.',tipo:'Formato não suportado (use JPG, PNG, WEBP ou GIF).',db:'Banco de dados indisponível.',interno:'Erro interno. Tente de novo.',campo_obrigatorio:'Preencha os campos obrigatórios.',campo_longo:'Texto longo demais.',campo_invalido:'Valor inválido.',categoria_inexistente:'Escolha uma categoria válida.',nao_encontrado:'Conteúdo não encontrado.',json_invalido:'Requisição inválida.'};
let cats=[],cur=0,eid=0,ecat=0,csrf='',t0,toastT;

function toast(msg){const el=$('#toast');el.textContent=msg;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true},4200)}

async function apiOnce(a,d,p=''){
  const opt={method:d?'POST':'GET',headers:{}};
  if(d){opt.headers['X-CSRF']=csrf;opt.body=JSON.stringify(d)}
  let r;
  try{r=await fetch('api.php?a='+a+p,opt)}catch(e){toast('Sem conexão com o servidor.');throw e}
  let j={};
  try{j=await r.json()}catch(e){toast('Resposta inválida do servidor (HTTP '+r.status+').');throw new Error('resposta_invalida')}
  if(j&&j.csrf)csrf=j.csrf;
  if(r.status===401&&a!=='login'){$('#login').hidden=false;$('#app').hidden=true;toast('Sessão expirada. Entre novamente.');throw new Error('auth')}
  if(!r.ok){toast(MSG[j.erro]||('Erro '+r.status));throw new Error(j.erro||('http_'+r.status))}
  return j;
}
async function api(a,d,p='',retry=true){
  try{return await apiOnce(a,d,p)}
  catch(e){if(retry&&e.message==='csrf'){await apiOnce('me');return apiOnce(a,d,p)}throw e}
}

$('#entrar').onclick=doLogin;
$('#senha').onkeydown=e=>{if(e.key==='Enter')doLogin()};
async function doLogin(){
  const b=$('#entrar');if(b.disabled)return;b.disabled=true;
  try{await api('login',{senha:$('#senha').value});$('#senha').value='';await start()}
  catch(e){}
  finally{b.disabled=false}
}
async function start(){$('#login').hidden=true;$('#app').hidden=false;await loadCats();await list()}

api('me').then(m=>{csrf=m.csrf;return m.ok?start():($('#login').hidden=false)}).catch(()=>{$('#login').hidden=false});

async function loadCats(){
  cats=await api('cats');
  $('#cats').innerHTML=`<div class="cat ${cur?'':'on'}" data-id="0" role="button" tabindex="0">📚 <span>Tudo</span></div>`
    +cats.map(c=>`<div class="cat ${cur==c.id?'on':''}" data-id="${c.id}" role="button" tabindex="0" style="--c:${esc(c.color)}">${esc(c.emoji)} <span>${esc(c.name)}</span><small>${c.n}</small><i data-e="${c.id}" title="Editar categoria" aria-hidden="true">✏️</i></div>`).join('');
}
function isActivate(e){return e.key==='Enter'||e.key===' '}
$('#cats').onclick=e=>{if(e.target.dataset.e)return editCat(+e.target.dataset.e);const c=e.target.closest('.cat');if(c)selectCat(+c.dataset.id)};
$('#cats').onkeydown=e=>{if(!isActivate(e))return;const c=e.target.closest('.cat');if(!c)return;e.preventDefault();if(e.target.dataset.e)return editCat(+e.target.dataset.e);selectCat(+c.dataset.id)};
function selectCat(id){cur=id;$('#busca').value='';loadCats().catch(()=>{});list().catch(()=>{})}

async function list(){
  const q=$('#busca').value.trim();
  const t=await api('topics',0,`&cat=${cur}&q=${encodeURIComponent(q)}`);
  $('#view').innerHTML=t.length
    ?`<div class="grid">${t.map((x,i)=>`<div class="card tp" style="animation-delay:${i*40}ms;--c:${esc(x.color)}" data-id="${x.id}" role="button" tabindex="0"><b>${esc(x.emoji)} ${esc(x.title)}</b><small>${esc(x.cat)}</small></div>`).join('')}</div>`
      +(t.length===100?`<p class="hint">Mostrando os 100 tópicos mais recentes. Refine a busca para ver outros.</p>`:'')
    :`<div class="empty"><div class="mascot">🐱</div><p>${q?'Nada encontrado. Tente outra palavra.':'Ainda não há tópicos aqui. Crie o primeiro!'}</p></div>`;
}
$('#busca').oninput=()=>{clearTimeout(t0);t0=setTimeout(()=>list().catch(()=>{}),200)};
$('#view').onclick=e=>{const c=e.target.closest('.tp');if(c)show(+c.dataset.id).catch(()=>{})};
$('#view').onkeydown=e=>{if(!isActivate(e))return;const c=e.target.closest('.tp');if(!c)return;e.preventDefault();show(+c.dataset.id).catch(()=>{})};

async function show(id){
  const t=await api('topic',0,'&id='+id);
  const when=t.updated_at?new Date(t.updated_at).toLocaleDateString('pt-BR'):'';
  $('#view').innerHTML=`<div class="card doc"><button class="btn ghost" style="width:auto;margin:0 0 10px" id="back">← Voltar</button><h1>${esc(t.title)}</h1><div class="meta">${esc(t.cat)}${when?' · atualizado em '+when:''}</div><div class="body">${t.body}</div><div class="row"><button class="btn" id="tedit">Editar</button><button class="btn ghost" style="width:auto;margin:0" id="tdel">Excluir</button></div></div>`;
  $('#back').onclick=()=>list().catch(()=>{});
  $('#tedit').onclick=()=>editTopic(t.id).catch(()=>{});
  $('#tdel').onclick=()=>delTopic(t.id);
}
async function delTopic(id){
  if(!confirm('Excluir este tópico?'))return;
  try{await api('topic_del',{id});await loadCats();await list()}catch(e){}
}

function editCat(id){
  const c=cats.find(x=>x.id==id)||{};
  ecat=id||0;
  $('#cn').value=c.name||'';$('#ce').value=c.emoji||'🌸';$('#cc').value=c.color||'#ffd6e7';
  $('#cdel').hidden=!id;dcat.showModal();$('#cn').focus();
}
$('#newcat').onclick=()=>editCat(0);
$('#ccancel').onclick=()=>dcat.close();
$('#csave').onclick=async()=>{
  const name=$('#cn').value.trim();
  if(!name)return $('#cn').focus();
  try{
    await api('cat_save',{id:ecat,name,emoji:$('#ce').value,color:$('#cc').value});
    dcat.close();await loadCats();await list();
  }catch(e){}
};
$('#cdel').onclick=async()=>{
  if(!confirm('Excluir a categoria e todos os tópicos dela?'))return;
  try{await api('cat_del',{id:ecat});dcat.close();cur=0;await loadCats();await list()}catch(e){}
};

async function editTopic(id){
  if(!cats.length){toast('Crie uma categoria primeiro 🌸');return}
  eid=id||0;
  const t=id?await api('topic',0,'&id='+id):{title:'',body:'',category_id:cur||cats[0].id};
  $('#tt').value=t.title;$('#ed').innerHTML=t.body;
  $('#tc').innerHTML=cats.map(c=>`<option value="${c.id}" ${c.id==t.category_id?'selected':''}>${esc(c.emoji)} ${esc(c.name)}</option>`).join('');
  dtopic.showModal();$('#tt').focus();
}
$('#newtopic').onclick=()=>editTopic(0).catch(()=>{});
$('#tcancel').onclick=()=>dtopic.close();

document.querySelectorAll('.tb [data-c]').forEach(b=>b.onclick=()=>{
  const c=b.dataset.c;
  c=='h2'?document.execCommand('formatBlock',0,'h2'):document.execCommand({ul:'insertUnorderedList',ol:'insertOrderedList'}[c]||c);
  $('#ed').focus();
});

async function up(f){
  const fd=new FormData();fd.append('f',f);
  let r;
  try{r=await fetch('api.php?a=upload',{method:'POST',headers:{'X-CSRF':csrf},body:fd})}
  catch(e){toast('Sem conexão com o servidor.');return}
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok||!j.url){toast(MSG[j.erro]||'Foto não enviada.');return}
  $('#ed').focus();document.execCommand('insertImage',0,j.url);
}
$('#pic').onclick=()=>$('#file').click();
$('#file').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)up(f)};
$('#ed').onpaste=e=>{for(const i of e.clipboardData.items)if(i.type.startsWith('image/')){e.preventDefault();up(i.getAsFile())}};

$('#tsave').onclick=async()=>{
  if(!$('#tt').value.trim())return $('#tt').focus();
  try{
    const r=await api('topic_save',{id:eid,title:$('#tt').value,category_id:$('#tc').value,body:$('#ed').innerHTML});
    dtopic.close();confetti();await loadCats();await show(r.id);
  }catch(e){}
};
function confetti(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  for(let i=0;i<26;i++){
    const s=document.createElement('span');s.className='conf';
    s.textContent=['🌸','✨','💖','⭐'][i%4];
    s.style.left=Math.random()*100+'vw';s.style.animationDelay=Math.random()*.5+'s';
    document.body.append(s);setTimeout(()=>s.remove(),2200);
  }
}
</script>
</body></html>
